.product-editor fieldset[aria-label="Categoría y subcategoría"]>.product-extra-categories{grid-column:1/-1;grid-row:auto;margin-top:6px}

/* Selector múltiple de categorías en el editor */
.product-editor fieldset[aria-label="Categoría y subcategoría"]>#category-picker-label{grid-column:1;grid-row:1}
.product-editor fieldset[aria-label="Categoría y subcategoría"]>#category-picker{grid-column:1;grid-row:2;min-width:0;margin:0}
.product-editor fieldset[aria-label="Categoría y subcategoría"]>#category-picker>summary{cursor:pointer;display:flex;align-items:center;min-height:42px;padding:8px 11px;border:1px solid var(--stroke);border-radius:9px;background:#fff;font-weight:600;overflow-wrap:anywhere}
.product-editor fieldset[aria-label="Categoría y subcategoría"]>#category-picker[open]>summary{border-color:var(--ac);border-radius:9px 9px 0 0}
.product-editor .category-picker-options{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr));gap:3px;max-height:190px;overflow:auto;padding:6px;border:1px solid var(--stroke);border-top:0;border-radius:0 0 9px 9px;background:#fff}

.product-editor .category-picker-options label:has(input:checked){background:#b3261e12;color:var(--ac);font-weight:700}
.product-editor .category-picker-options input{flex:0 0 auto;width:16px;height:16px;margin:0;accent-color:var(--ac)}

.product-editor #product-subcategory-picker[open]>summary{border-color:var(--ac);border-radius:9px 9px 0 0}
.product-editor #product-subcategory-options{grid-template-columns:repeat(auto-fit,minmax(min(100%,120px),1fr))}

const MAX_STORE_IMAGE_BYTES=149999;
async function compressStoreImage(file,fit,kind){
  if(!file.type.startsWith('image/'))throw new Error('Elige un archivo de imagen.');
  const source=URL.createObjectURL(file);
  const image=new Image();
  try{
    image.src=source;
    await image.decode();
    const canvas=document.createElement('canvas'),context=canvas.getContext('2d');
    const qr=kind==='QR', product=kind==='product';
    for(const edge of qr?[768,640,512,384,288]:[960,768,576,448,320,224]){
      const ratio=product?edge/image.naturalWidth:Math.min(1,edge/Math.max(image.naturalWidth,image.naturalHeight));
      canvas.width=product?edge:Math.max(1,Math.round(image.naturalWidth*ratio));
      canvas.height=product?Math.round(edge*.75):Math.max(1,Math.round(image.naturalHeight*ratio));
      context.imageSmoothingEnabled=!qr;
      if(product||qr){
        context.fillStyle='#fff';
        context.fillRect(0,0,canvas.width,canvas.height);
      }
      const scale=(fit==='cover'?Math.max:Math.min)(canvas.width/image.naturalWidth,canvas.height/image.naturalHeight);
      const width=image.naturalWidth*scale,height=image.naturalHeight*scale;
      context.drawImage(image,(canvas.width-width)/2,(canvas.height-height)/2,width,height);
      const mime=qr?'image/png':'image/webp';
      for(const quality of qr?[undefined]:[.88,.77,.66,.55,.44]){
        const blob=await new Promise(resolve=>canvas.toBlob(resolve,mime,quality));
        if(blob&&blob.size>0&&blob.size<=MAX_STORE_IMAGE_BYTES)return blob;
      }
    }
    throw new Error('No se pudo comprimir la imagen a menos de 150 KB.');
  }finally{URL.revokeObjectURL(source)}
}
async function prepareStoreImage(input,preview,fit,kind,onReady){
  const file=input.files[0];
  if(!file||input.disabled)return;
  const request=Symbol();
  input.imageRequest=request;
  input.setAttribute('aria-busy','true');
  const stillCurrent=()=>input.isConnected&&input.imageRequest===request;
  try{
    const image=await compressStoreImage(file,fit,kind);
    if(!stillCurrent())return;
    clearImagePreview();
    adminImagePreview=URL.createObjectURL(image);
    preview.src=adminImagePreview;
    input.storageDraft=image;
    onReady?.();
    toast('Imagen optimizada. Guarda los cambios para subirla.');
  }catch(error){
    if(stillCurrent()){input.value='';toast(error.message||'No se pudo preparar la imagen.')}
  }finally{
    if(stillCurrent())input.removeAttribute('aria-busy');
  }
}
async function uploadStoreImage(input,kind){
  const image=input?.storageDraft;
  if(!image)return null;
  const extensions={'image/webp':'webp','image/png':'png','image/jpeg':'jpg'};
  const ext=extensions[image.type];
  if(!ext||image.size>MAX_STORE_IMAGE_BYTES)throw new Error('Imagen inválida.');
  const bucket=adminClient.storage.from('kenstore-media');
  const imageId=crypto.randomUUID();
  let path=kind+'/'+imageId+'.'+ext;
  input.disabled=true;
  input.setAttribute('aria-busy','true');
  try{
    if(kind==='product'&&ext==='webp'&&typeof createImageBitmap==='function'){
      const bitmap=await createImageBitmap(image);
      try{
        if(bitmap.width>=640){
          const stem='product/card2-'+imageId;
          for(const width of [224,400,640]){
            const canvas=document.createElement('canvas');
            canvas.width=width;canvas.height=Math.max(1,Math.round(bitmap.height*width/bitmap.width));
            canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);
            const thumb=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',.78));
            if(!thumb)throw new Error('No se pudo preparar la miniatura.');
            await kenResult(bucket.upload(stem+'-'+width+'.webp',thumb,{contentType:'image/webp',cacheControl:'31536000'}));
          }
          path=stem+'.webp';
        }
      }finally{bitmap.close()}
    }
    await kenResult(bucket.upload(path,image,{contentType:image.type,cacheControl:'31536000',upsert:false}));
    input.storageDraft=null;
    return bucket.getPublicUrl(path).data.publicUrl;
  }finally{
    input.disabled=false;
    input.removeAttribute('aria-busy');
  }
}

function solesToUsdt(value){
  if(String(value??'').trim()==='')return null;
  const soles=Number(value),cents=Math.round(soles*100);
  if(!Number.isSafeInteger(cents)||soles<0||!Number.isSafeInteger(cents*315))return null;
  return Math.round(cents*315/1000)/100;
}
function updateUsdtPrice(){
  const usdt=solesToUsdt($('#pp').value);
  $('#pu').value=usdt===null?'':usdt.toFixed(2);
}
const ACCESS_UNITS={days:'Días',months:'Meses',years:'Años'};
function productDescriptionFields(product){
  if(product.descriptionSpec)return product.descriptionSpec;
  const legacy=String(product.i||'');
  const access=legacy.match(/^\s*-\s*👤\s*(.+)$/mu)?.[1]||'';
  const delivery=legacy.match(/^\s*\*\*📦\s*(.+)$/mu)?.[1]?.replaceAll('**','')||'';
  const rule=legacy.match(/^\s*⚠️\s*(.+)$/mu)?.[1]||'';
  const warranty=legacy.match(/[^.!?\n]{0,40}garant[ií]a[^.!?\n]{0,60}/iu)?.[0]?.trim()||'';
  return {access,delivery,rule,warranty,usage:''};
}

function updatePlanEditor(){

function addProductPlan(){

function readProductPlans(){
  const rows=[...document.querySelectorAll('.plan-editor-row')];
  const plans=rows.map(row=>{
    const field=key=>row.querySelector(`[data-plan="${key}"]`);
    const name=field('name').value.trim(),price=field('price').valueAsNumber;
    const previous=field('previous').value===''?null:field('previous').valueAsNumber;
    const amount=field('amount').valueAsNumber,unit=field('unit').value;
    if(!name||!(price>0)||!field('price').checkValidity()||solesToUsdt(price)===null||
       (previous!==null&&(!(previous>price)||!field('previous').checkValidity()))||
       !Number.isInteger(amount)||!field('amount').checkValidity())throw new Error('Completa el nombre, precio y duración de cada plan. El precio anterior debe ser mayor.');
    return {id:row.dataset.planId,name,price,previous,duration:{amount,unit}};
  });
  if(new Set(plans.map(p=>p.name.toLocaleLowerCase('es'))).size!==plans.length)throw new Error('Usa un nombre distinto para cada plan.');
  return plans;
}

async function admGuardar(){if(publishing)return;
  const imageInput=$('#pfile');
  if(imageInput.hasAttribute('aria-busy'))return toast('Espera a que termine el procesamiento de la imagen.');
  const n=v('pn').trim(),c=v('pc');
  if(!n)return productEditorError('Escribe el nombre del producto.','#pn');
  if(!CATS.some(entry=>entry[0]===c))return productEditorError('Elige una categoría existente.','#pc');
  let plans;
  try{plans=readProductPlans()}catch(error){return productEditorError(error.message,'.plan-editor-row input')}
  const priceField=$('#pp'),u=solesToUsdt(plans[0]?.price??priceField.value);
  if(!plans.length&&(u===null||!priceField.checkValidity()))return productEditorError('Ingresa un precio válido con hasta dos decimales (0 = gratis).','#pp');
  const price=plans[0]?.price??Number(priceField.value);
  const num=(i)=>{const t=v(i).trim();if(t==='')return null;const x=parseFloat(t);return isNaN(x)||x<0?NaN:x};
  const po=plans.length?plans[0].previous:num('ppo');if(Number.isNaN(po))return productEditorError('Revisa el precio anterior.','#ppo');
  const outOfStock=v('pstock')==='out';
  const st=outOfStock?0:old?(old.st===0?(old.previousStock??null):old.st):null;
  const members=admCheckedSubs();
  if(members.length>4)return productEditorError('Selecciona hasta cuatro subcategorías.','#ps');
  const extraCategories=readExtraCategories();
  if(new Set([c,...extraCategories.map(item=>item.category)]).size!==extraCategories.length+1)return toast('Elige categorías distintas.');
  if(extraCategories.some(item=>item.subs.length>4))return toast('Selecciona hasta cuatro subcategorías por categoría.');
  const s=members[0]||'';
  const old=ADM.id?prod(ADM.id):null,type=v('pt'),byPlayerId=type==='playerId',t=byPlayerId?'':type,askExtra=!type&&$('#pxon').checked,xl=v('pxl').trim();
  if(askExtra&&!xl)return productEditorError('Escribe qué dato quieres pedir al cliente.','#pxl');
  const durationInput=$('#access-amount'),amount=durationInput.valueAsNumber,unit=v('access-unit');
  const hasDuration=durationInput.value!=='';
  if(!durationInput.checkValidity()||(hasDuration&&(!Number.isSafeInteger(amount)||!Object.hasOwn(ACCESS_UNITS,unit)))){
    return productEditorError('Escribe una duración válida en días, meses o años.','#access-amount');
  }
  const downloadValue=v('desc-download').trim();
  let downloadUrl='';
  if(downloadValue){
    try{
      const url=new URL(downloadValue);
      if(url.protocol==='https:'&&!url.username&&!url.password)downloadUrl=url.href;
    }catch{}
    if(!downloadUrl)return productEditorError('Ingresa un enlace HTTPS válido.','#desc-download');
  }
  try{
    const imageUrl=await uploadStoreImage(imageInput,'product');
    if(!imageInput.isConnected)return;
    if(imageUrl){ADM.img=imageUrl;clearImagePreview();$('#pv').src=imageUrl}
  }catch(error){return toast('No se pudo subir la imagen. Intenta guardar otra vez.')}
  if(publishing)return;
  const descriptionSpec={access:v('desc-access').trim(),delivery:v('desc-delivery').trim(),warranty:v('desc-warranty').trim(),usage:v('desc-usage').trim(),rule:v('desc-rule').trim()};
  const d=old?.d||descriptionSpec.access||n;
  const o={id:ADM.id||Math.max(Date.now(),Math.max(0,...P.map(x=>x.id))+1),n,c,s,subcategories:members,extraCategories,d,st,pills:old?.pills||[],p:price,po,u,
    img:ADM.img||tile('gift','#e6dcff'),x:byPlayerId?{...playerIdOrderField}:askExtra?{l:xl,ph:v('pxp').trim()}:null};
  if(old?.promotion){
    if(Date.parse(old.promotion.end)>Date.now()&&old.promotion.price>=price)return toast('Ajusta o retira el descuento programado antes de reducir el precio habitual.');
    o.promotion=old.promotion;
  }
  if(plans.length)o.plans=plans;
  if(ADM.paused)o.paused=true;
  if(outOfStock&&old)o.previousStock=old.st===0?old.previousStock??null:old.st;
  if(old?.i)o.i=old.i;
  if(!old||old.descriptionSpec||Object.values(descriptionSpec).some(Boolean))o.descriptionSpec=descriptionSpec;
  if(downloadUrl)o.downloadUrl=downloadUrl;
  else delete o.downloadUrl;
  if(downloadUrl)o.downloadLabel='Descargar';
  else delete o.downloadLabel;
  if(t)o.t=t;
  if(hasDuration)o.accessDuration={amount,unit};
  delete o.cardBenefit;
  const snap=[JSON.stringify(P),JSON.stringify(CATS),JSON.stringify(SUBS)];
  if(members.length)SUBS[c]=[...new Set([...(SUBS[c]||[]),...members])];
  if(old)P[P.indexOf(old)]=o;else P.push(o);
  if(!await admSave()){P.length=0;JSON.parse(snap[0]).forEach(x=>P.push(x));CATS.length=0;JSON.parse(snap[1]).forEach(x=>CATS.push(x));Object.keys(SUBS).forEach(k=>delete SUBS[k]);Object.assign(SUBS,JSON.parse(snap[2]));return}
  toast(old?'Producto actualizado':'Producto agregado');admList();
}

function categoryPixelIndex(value){
  if(typeof value!=='string')return -1;
  const match=/^pixel:([0-9]{1,2})$/.exec(value);
  return match?Number(match[1]):legacyCategoryEmojis.indexOf(value);
}
const distinctPixelSymbols={31:'🔖',34:'🏫',42:'📷',51:'🌙',59:'🧭',62:'🎈',94:'🧲',95:'🗝️'};
const categoryPixelCache=new Map();
function categoryPixelImage(index){
  if(!categoryPixelCache.has(index)){
    const artwork=index%10===0?categoryPixelArtwork(pixelShapes[index/10]):drawCategoryPixel(distinctPixelSymbols[index]||legacyCategoryEmojis[index]);
    categoryPixelCache.set(index,artwork);
  }
  return `<img class="category-pixel" src="${categoryPixelCache.get(index)}" alt="">`;
}
function drawCategoryPixel(emoji){
  const canvas=document.createElement('canvas');
  canvas.width=canvas.height=16;
  const context=canvas.getContext('2d');
  context.font='14px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
  context.textAlign='center';
  context.textBaseline='middle';
  context.fillText(emoji,8,8,16);
  const pixels=context.getImageData(0,0,16,16);
  for(let i=3;i<pixels.data.length;i+=4)pixels.data[i]=pixels.data[i]>=100?255:0;
  context.putImageData(pixels,0,0);
  return canvas.toDataURL();
}

function categoryPixelArtwork(shape){return categoryPixelSprites[shape]}
function admEmojiSelect(id,value='',category){
  const selected=categoryPixelIndex(value);
  const defaultIcon=admCategoryIcon(category);
  const options=legacyCategoryEmojis.map((emoji,i)=>{
    const label=i%10===0?pixelShapeLabels[i/10]:'Ícono pixel '+(distinctPixelSymbols[i]||emoji);
    return `<button type="button" class="pixel-choice" data-icon="${i}" title="${label}" aria-label="${label}" aria-pressed="${i===selected}" onclick="admPickPixel(this)">${categoryPixelImage(i)}</button>`;
  }).join('');
  return `<details class="pixel-picker"><summary>Ícono de la categoría <span class="pixel-preview">${selected<0?defaultIcon:categoryPixelImage(selected)}</span></summary>
    <input type="hidden" id="${id}" value="${selected<0?'':'pixel:'+selected}">
    <div class="pixel-grid" role="group" aria-label="100 íconos pixel">
      <button type="button" class="pixel-choice" data-icon="" aria-label="Ícono predeterminado" title="Ícono predeterminado" aria-pressed="${selected<0}" onclick="admPickPixel(this)">${defaultIcon}</button>${options}
    </div>
  </details>`;
}
function admPickPixel(button){
  const picker=button.closest('.pixel-picker'),index=button.dataset.icon;
  picker.querySelector('input').value=index===''?'':'pixel:'+index;
  picker.querySelector('[aria-pressed="true"]').setAttribute('aria-pressed','false');
  button.setAttribute('aria-pressed','true');
  picker.querySelector('.pixel-preview').innerHTML=button.innerHTML;
}
function admCategoryIcon(category,emoji){
  const index=categoryPixelIndex(emoji);
  if(index>=0)return categoryPixelImage(index);
  const icon=Object.hasOwn(categoryIcons,category)?categoryIcons[category]:categoryIcons.default;
  return `<img src="${icon}" alt="" width="22" height="22">`;
}
function catalogHidden(category,sub){
  return (Array.isArray(SITE.hiddenCatalog)?SITE.hiddenCatalog:[]).some(entry=>entry?.[0]===category&&entry[1]===sub);
}
function admCatalogToggle(i,j){
  const category=CATS[i]?.[0];
  if(!category||category==='all')return;
  const sub=j===undefined?undefined:admSubs(category)[j];
  if(j!==undefined&&!sub)return;
  const hidden=catalogHidden(category,sub);
  const label=sub?'Subcategoría':'Categoría';
  admCatalogChange(()=>{
    const entries=Array.isArray(SITE.hiddenCatalog)?SITE.hiddenCatalog:[];
    SITE.hiddenCatalog=hidden
      ? entries.filter(entry=>entry[0]!==category||entry[1]!==sub)
      : [...entries,sub===undefined?[category]:[category,sub]];
  },label+(hidden?' activada':' desactivada'),true);
}
const openCatalogCategories=new Set();
function admCats(){
  ADM.tab='cat';
  const cs=CATS.filter(c=>c[0]!='all');
  modal(`<h2 class="adm-cat-title">${admCategoryIcon()}Categorías y subcategorías</h2>
  <fieldset class="category-create"><legend>Nueva categoría</legend>
  <label for="nc">Nombre</label><input id="nc" maxlength="30" placeholder="Ej: Música">
  ${admEmojiSelect('ncemoji')}
  <div class="bar2"><button class="pri" onclick="admCatAdd()">Agregar categoría</button></div></fieldset>
  ${cs.map(entry=>{
    const [c,,emoji,iconKey=c]=entry,i=CATS.indexOf(entry),subs=admSubs(c);
    const products=P.filter(p=>productPlacements(p).some(item=>item.category===c)), hidden=catalogHidden(c);
    return `<details class="catalog-admin-card" data-category="${esc(c)}"${openCatalogCategories.has(c)?' open':''} ontoggle="this.open?openCatalogCategories.add(this.dataset.category):openCatalogCategories.delete(this.dataset.category)">
      <summary class="catalog-card-head"><div><h3 class="adm-cat-title" id="cat_${i}">${admCategoryIcon(iconKey,emoji)}${esc(c)}</h3>
      <p class="mu">${products.length} producto${products.length===1?'':'s'}</p></div>
      <span class="catalog-status${hidden?' off':''}">${hidden?'Desactivada':'Activa'}</span></summary>
      <div class="catalog-card-actions"><button type="button" class="catalog-toggle" aria-label="${hidden?'Activar':'Desactivar'} categoría ${esc(c)}" aria-pressed="${!hidden}" onclick="admCatalogToggle(${i})">${hidden?'Activar':'Desactivar'}</button><button type="button" onclick="admCatEdit(${i})">Editar categoría</button><button type="button" class="del" onclick="admCatDel(${i})">Eliminar categoría</button></div>
      ${subs.length?`<ul class="adm-sub-list" aria-label="Subcategorías de ${esc(c)}">${subs.map((sub,j)=>{
        const ownHidden=catalogHidden(c,sub);
        return `<li class="catalog-sub-row"><div class="catalog-sub-main"><strong>${esc(sub)}</strong><span class="catalog-status${hidden||ownHidden?' off':''}">${ownHidden?'Desactivada':hidden?'Oculta por categoría':'Activa'}</span></div><button type="button" class="catalog-toggle" aria-label="${ownHidden?'Activar':'Desactivar'} subcategoría ${esc(c)} · ${esc(sub)}" aria-pressed="${!ownHidden}" onclick="admCatalogToggle(${i},${j})">${ownHidden?'Activar':'Desactivar'}</button><button type="button" aria-label="Editar ${esc(sub)}" onclick="admSubEdit(${i},${j})">Editar</button><button type="button" class="del" aria-label="Eliminar ${esc(sub)}" onclick="admSubDel(${i},${j})">Eliminar</button></li>`;
      }).join('')}</ul>`:'<p class="mu">Sin subcategorías.</p>'}
      <form class="catalog-add-sub" onsubmit="admSubAdd(${i});return false">
        <label for="ns_${i}">Nueva subcategoría</label>
        <input id="ns_${i}" maxlength="40" placeholder="Ej: Spotify" required>
        <div class="bar2"><button type="submit" class="pri">Agregar subcategoría</button></div>
      </form>
    </details>`;
  }).join('')||'<p class="mu">Sin categorías.</p>'}
  <div class="bar2"><button onclick="admList()">Volver a productos</button></div>`,'adm');
}
async function admCatAdd(){if(publishing)return;const c=v('nc').trim();if(!c)return toast('Escribe un nombre.');
  if(['todo','all','__new__'].includes(c.toLowerCase()))return toast('Ese nombre de categoría no está disponible.');
  if(CATS.some(x=>x[0].toLowerCase()==c.toLowerCase()))return toast('Esa categoría ya existe.');
  CATS.push([c,c,v('ncemoji')]);
  if(!await admSave()){CATS.pop();return}
  admCats();toast('Categoría agregada');
}
async function admSubAdd(i){if(publishing)return;
  const entry=CATS[i];
  if(!entry||entry[0]==='all')return;
  const [c]=entry,s=v('ns_'+i).trim();
  if(!s)return toast('Escribe el nombre de la subcategoría.');
  if(admSubs(c).some(name=>name.toLowerCase()===s.toLowerCase()))return toast('Esa subcategoría ya existe en esta categoría.');
  const previous=SUBS[c];
  SUBS[c]=[...(previous||[]),s];
  if(!await admSave()){
    if(previous)SUBS[c]=previous;else delete SUBS[c];
    return;
  }
  admCats();
  $('#ns_'+i).focus();
  toast('Subcategoría agregada');
}
function updateCatalogOrderScopes(transform){
  const moved={};
  for(const [key,ids] of Object.entries(SITE.catalogOrders||{})){
    let scope;
    try{scope=JSON.parse(key)}catch{continue}
    if(!Array.isArray(scope))continue;
    const next=transform(scope);
    if(next)moved[catalogScopeKey(...next)]=ids;
  }
  SITE.catalogOrders=moved;
}
async function admCatalogChange(update,message,keepPosition=false){
  if(publishing)return;
  const snapshot=structuredClone([P,CATS,SUBS,SITE.hiddenCatalog||[],SITE.catalogOrders]);
  const scroll=window.scrollY;
  update();
  if(!await admSave()){admApply(...snapshot.slice(0,3));SITE.hiddenCatalog=snapshot[3];SITE.catalogOrders=snapshot[4];return}
  if(ADM.tab==='cat'){
    admCats();
    if(keepPosition)window.scrollTo(0,scroll);
  }
  toast(message);
}
function admCatEdit(i){
  const [category,,emoji,iconKey=category]=CATS[i];
  modal(`<h2>Editar categoría</h2><form onsubmit="admCatEditSave(${i});return false">
    <label for="cat-name">Nombre</label><input id="cat-name" maxlength="30" value="${esc(category)}" required>
    ${admEmojiSelect('cat-icon',emoji,iconKey)}
    <div class="bar2"><button class="pri" type="submit">Guardar cambios</button><button type="button" onclick="admCats()">Cancelar</button></div></form>`);
}
function admCatEditSave(i){
  const [category,,,iconKey=category]=CATS[i],name=v('cat-name').trim();
  if(!name)return toast('Escribe un nombre.');
  if(['todo','all','__new__'].includes(name.toLowerCase()))return toast('Ese nombre de categoría no está disponible.');
  if(CATS.some(([key],j)=>j!==i&&key.toLowerCase()===name.toLowerCase()))return toast('Esa categoría ya existe.');
  admCatalogChange(()=>{
    CATS[i]=[name,name,v('cat-icon'),iconKey];
    if(name===category)return;
    updateCatalogOrderScopes(([cat,sub])=>[cat===category?name:cat,sub]);
    SITE.hiddenCatalog=(Array.isArray(SITE.hiddenCatalog)?SITE.hiddenCatalog:[]).map(entry=>entry[0]===category?[name,...entry.slice(1)]:entry);
    if(Object.hasOwn(SUBS,category)){SUBS[name]=SUBS[category];delete SUBS[category]}
    P.forEach(p=>{const memberships=productPlacements(p);if(memberships.some(item=>item.category===category))applyProductPlacements(p,memberships.map(item=>item.category===category?{...item,category:name}:item))});
  },'Categoría actualizada');
}
function admCatDel(i){
  const [category]=CATS[i],used=P.some(p=>productPlacements(p).every(item=>item.category===category));
  const targets=CATS.filter(([key])=>key!=='all'&&key!==category);
  if(used&&!targets.length)return toast('Crea otra categoría para mover los productos primero.');
  modal(`<h2>Eliminar categoría</h2><p>¿Eliminar <b>${esc(category)}</b> y sus subcategorías?</p>
    ${used?`<label for="cat-target">Mover productos a</label><select id="cat-target">${targets.map(([key,label])=>`<option value="${esc(key)}">${esc(label)}</option>`).join('')}</select><p class="mu">Los productos se moverán sin subcategoría.</p>`:''}
    <div class="bar2"><button class="del" onclick="admCatDelSave(${i})">Eliminar categoría</button><button onclick="admCats()">Cancelar</button></div>`);
}
function admCatDelSave(i){
  const [category]=CATS[i],destination=v('cat-target'),products=P.filter(p=>productPlacements(p).some(item=>item.category===category));
  if(products.some(p=>productPlacements(p).length===1)&&!CATS.some(([key])=>key===destination&&key!=='all'&&key!==category))return toast('Selecciona una categoría válida.');
  admCatalogChange(()=>{
    products.forEach(p=>{const remaining=productPlacements(p).filter(item=>item.category!==category);applyProductPlacements(p,remaining.length?remaining:[{category:destination,subs:[]}])});
    CATS.splice(i,1);
    delete SUBS[category];
    updateCatalogOrderScopes(scope=>scope[0]===category?null:scope);
    SITE.hiddenCatalog=(Array.isArray(SITE.hiddenCatalog)?SITE.hiddenCatalog:[]).filter(entry=>entry[0]!==category);
  },'Categoría eliminada');
}
function admSubEdit(i,j){
  const [category]=CATS[i],sub=admSubs(category)[j];
  modal(`<h2>Editar subcategoría</h2><p class="mu">${esc(category)}</p><form onsubmit="admSubEditSave(${i},${j});return false">
    <label for="sub-name">Nombre</label><input id="sub-name" maxlength="40" value="${esc(sub)}" required>
    <div class="bar2"><button class="pri" type="submit">Guardar cambios</button><button type="button" onclick="admCats()">Cancelar</button></div></form>`);
}
function admSubEditSave(i,j){
  const [category]=CATS[i],subs=admSubs(category),sub=subs[j],name=v('sub-name').trim();
  if(!name)return toast('Escribe un nombre.');
  if(subs.some((item,k)=>k!==j&&item.toLowerCase()===name.toLowerCase()))return toast('Esa subcategoría ya existe en esta categoría.');
  admCatalogChange(()=>{
    SUBS[category]=subs.map(item=>item===sub?name:item);
    updateCatalogOrderScopes(([cat,member])=>[cat,cat===category&&member===sub?name:member]);

function catalogBackupError(d){
  const object=value=>value!==null&&typeof value==='object'&&!Array.isArray(value);
  const text=(value,max)=>typeof value==='string'&&value.length<=max;
  const price=value=>typeof value==='number'&&Number.isFinite(value)&&value>=0&&value<=10000000&&Math.abs(value*100-Math.round(value*100))<1e-7;
  const safeUrl=(value,image=false)=>{
    if(!text(value, image?3_000_000:2048))return false;
    if(!value)return true;
    if(image&&/^data:image\/(?:png|jpe?g|webp|gif|svg\+xml);/i.test(value))return true;
    try{const url=new URL(value);return url.protocol==='https:'&&!url.username&&!url.password}
    catch{return false}
  };
  if(!object(d)||!Array.isArray(d.products)||d.products.length>2000)return 'El respaldo no tiene una lista de productos válida.';
  if(!Array.isArray(d.cats)&&!d.products.every(product=>object(product)&&typeof product.c==='string'))return 'El respaldo no tiene productos válidos.';
  const categories=d.cats??[['all','🔥 Todo'],...[...new Set(d.products.map(p=>p?.c).filter(x=>typeof x==='string'))].map(c=>[c,c])];
  const subcategories=d.subs??{};
  const site=d.site??SITE;
  if(!Array.isArray(categories)||!categories.length||categories.length>100||!categories.every(c=>Array.isArray(c)&&text(c[0],40)&&text(c[1],80)&&c.slice(2).every(x=>text(x,80))))return 'Revisa las categorías del respaldo.';
  const categoryKeys=new Set(categories.map(c=>c[0]));
  if(categoryKeys.size!==categories.length||!categoryKeys.has('all'))return 'El respaldo repite categorías o no incluye «Todo».';
  if(!object(subcategories)||Object.keys(subcategories).length>100||!Object.entries(subcategories).every(([key,list])=>categoryKeys.has(key)&&Array.isArray(list)&&list.length<=100&&list.every(name=>text(name,60))))return 'Revisa las subcategorías del respaldo.';
  if(!object(site)||JSON.stringify(site).length>1_000_000)return 'Los ajustes incluidos en el respaldo no son válidos.';
  const ids=new Set();
  for(const product of d.products){
    if(!object(product)||!Number.isSafeInteger(product.id)||product.id<1||ids.has(product.id)||!text(product.n,120)||!product.n.trim()||!categoryKeys.has(product.c)||!price(product.p))return 'Hay un producto con identificador, nombre, categoría o precio inválido.';
    ids.add(product.id);
    if(product.po!=null&&!price(product.po))return `Revisa el precio anterior de «${product.n}».`;
    if(product.st!=null&&(!Number.isSafeInteger(product.st)||product.st<0))return `Revisa el stock de «${product.n}».`;
    for(const key of ['s','d','t','i'])if(product[key]!=null&&!text(product[key],key==='i'?12000:2000))return `Revisa la descripción de «${product.n}».`;
    if(product.pills!=null&&(!Array.isArray(product.pills)||product.pills.length>30||!product.pills.every(item=>text(item,80))))return `Revisa los beneficios de «${product.n}».`;
    if(!safeUrl(product.img||'',true))return `La imagen de «${product.n}» no es una URL segura.`;
    if(product.u!=null&&(!Number.isFinite(product.u)||product.u<0))return `Revisa el precio USDT de «${product.n}».`;
    if(product.x!=null&&(!object(product.x)||Object.values(product.x).some(value=>!text(value,300))))return `Revisa los datos de pedido de «${product.n}».`;
    if(product.accessDuration!=null&&(!object(product.accessDuration)||!Number.isSafeInteger(product.accessDuration.amount)||product.accessDuration.amount<0||!['days','months','years'].includes(product.accessDuration.unit)))return `Revisa la duración de «${product.n}».`;
    if(product.descriptionSpec!=null&&(!object(product.descriptionSpec)||['access','delivery','warranty','usage','rule'].some(key=>product.descriptionSpec[key]!=null&&!text(product.descriptionSpec[key],3000))))return `Revisa los detalles de «${product.n}».`;
    if(product.downloadUrl!=null&&!safeUrl(product.downloadUrl))return `El enlace de descarga de «${product.n}» debe usar HTTPS.`;
    if(product.downloadLabel!=null&&!text(product.downloadLabel,60))return `Revisa el texto del enlace de «${product.n}».`;
    if(product.subcategories!=null&&(!Array.isArray(product.subcategories)||product.subcategories.length>4||!product.subcategories.every(item=>text(item,60))))return `Revisa las subcategorías de «${product.n}».`;
    if(product.extraCategories!=null&&(!Array.isArray(product.extraCategories)||product.extraCategories.length>3||!product.extraCategories.every(item=>object(item)&&categoryKeys.has(item.category)&&Array.isArray(item.subs)&&item.subs.length<=4&&item.subs.every(name=>text(name,60)))))return `Revisa las categorías adicionales de «${product.n}».`;
    if(product.plans!=null&&(!Array.isArray(product.plans)||product.plans.length>12||!product.plans.every(plan=>object(plan)&&text(plan.id,100)&&text(plan.name,60)&&plan.name.trim()&&price(plan.price)&&plan.price>0&&(plan.previous==null||price(plan.previous)&&plan.previous>plan.price)&&object(plan.duration)&&Number.isSafeInteger(plan.duration.amount)&&plan.duration.amount>=1&&plan.duration.amount<=9999&&['days','months','years'].includes(plan.duration.unit))))return `Revisa los planes de «${product.n}».`;
  }
  for(const product of d.products){
    const placements=[product.c,...(product.extraCategories||[]).map(item=>item.category)];
    if(new Set(placements).size!==placements.length)return `«${product.n}» tiene una categoría duplicada.`;
  }
  return '';
}
async function admImport(){

function updateMargin(form){
  const price=form.elements.sale.valueAsNumber;
  const cost=form.elements.cost.valueAsNumber;
  const rate=form.elements.fee_percent.valueAsNumber;
  const fixed=form.elements.fixed_fee.valueAsNumber;
  const result=form.querySelector('output');
  if(![price,cost,rate,fixed].every(Number.isFinite)||!form.checkValidity()){result.textContent='Completa los importes para calcular el margen.';return}
  const margin=price-cost-Math.round(price*rate)/100-fixed;
  const soles=new Intl.NumberFormat('es-PE',{style:'currency',currency:'PEN'});
  result.textContent='Margen estimado: '+soles.format(margin)+(price>0?' · '+(100*margin/price).toFixed(1)+' %':'');
}

async function admProductHistory(more=false){
  ADM.tab='history';
  if(!more){
    historyBefore=null;
    modal('<h2>Historial de productos</h2><div id="product-history" aria-live="polite"></div><button id="history-more" onclick="admProductHistory(true)">Cargar más</button>');
  }

  try{
    let query=adminClient.from('ken_product_history').select('*').order('id',{ascending:false}).limit(30);

    const rows=await kenResult(query);
    if(!list.isConnected)return;
    if(rows.length)historyBefore=rows.at(-1).id;
    const summary=value=>{
      if(!value)return '—';
      const stock=value.st==null?'Stock ilimitado':'Stock '+value.st;
      const promotion=value.promotion?` · Promo ${money(value.promotion.price)} (${promotionLocal(value.promotion.start)} → ${promotionLocal(value.promotion.end)})`:'';
      return `${money(value.p)}${value.po>value.p?' (antes '+money(value.po)+')':''} · ${stock} · ${value.paused?'Pausado':'Visible'}${promotion}`;
    };
    list.insertAdjacentHTML('beforeend',rows.map(row=>{
      const before=row.before_value,after=row.after_value;
      return `<article class="order-admin"><h3>${esc(after?.n||before?.n)} · ${!before?'Creado':!after?'Eliminado':'Editado'}</h3>
      <p class="mu">${esc(new Date(row.changed_at).toLocaleString('es-PE',{timeZone:'America/Lima'}))}</p>
      ${before?`<p><strong>Antes</strong> · ${esc(summary(before))}</p>`:''}${after?`<p><strong>Después</strong> · ${esc(summary(after))}</p>`:''}</article>`;
    }).join('')||(!more?'<p>Aún no hay cambios registrados.</p>':''));
    button.hidden=rows.length<30;
  }catch{toast('No se pudo cargar el historial.')}
  finally{button.disabled=false}
}
function promotionLocal(instant){
  const time=Date.parse(instant);
  return Number.isFinite(time)?new Date(time-5*3600000).toISOString().slice(0,16):'';
}
function promotionStatus(promo,now){
  const start=Date.parse(promo.start),end=Date.parse(promo.end);
  if(!Number.isFinite(start)||!(end>start)||end<=now)return 'Finalizado';
  return start>now?'Programado':'Activo';
}
const promoDate=new Intl.DateTimeFormat('es-PE',{dateStyle:'medium',timeStyle:'short',timeZone:'America/Lima'});
let promotionListTimer;
function renderPromotionLists(view){
  clearTimeout(promotionListTimer);
  if(!view?.isConnected)return;
  const now=Date.now(),active=[],upcoming=[],expired=[],times=[];
  for(const p of P){
    const promo=p.promotion;
    if(!promo)continue;
    const start=Date.parse(promo.start),end=Date.parse(promo.end),state=promotionStatus(promo,now);
    times.push(start,end);
    const row=`<article class="order-admin"><div class="admin-heading"><h3>${esc(p.n)}</h3><strong>${state}</strong></div>
      <p><strong>${money(promo.price)}</strong> <s>${money(p.p)}</s>${p.paused?' · Producto pausado':''}</p>
      <p class="mu">${Number.isFinite(start)&&Number.isFinite(end)?esc(promoDate.format(start)+' → '+promoDate.format(end)):'Horario inválido'}</p>
      <button type="button" onclick="admPromotions(${p.id})">${state==='Finalizado'?'Volver a programar':'Editar descuento'}</button>
      ${state==='Finalizado'?'':`<button type="button" onclick="changePromotion(${p.id},null)">Retirar descuento</button>`}</article>`;
    (state==='Activo'?active:state==='Programado'?upcoming:expired).push({row,time:state==='Programado'?start:end});
  }
  const section=(name,rows)=>rows.length?`<h3>${name}</h3>${rows.sort((a,b)=>a.time-b.time).map(x=>x.row).join('')}`:'';
  const expanded=view.querySelector('details')?.open;
  view.innerHTML=section('Activos',active)+section('Programados',upcoming)+
    (!active.length&&!upcoming.length?'<p class="mu">Todavía no hay descuentos activos ni programados.</p>':'')+
    (expired.length?`<details ${expanded?'open':''}><summary>Finalizados (${expired.length})</summary>${expired.sort((a,b)=>b.time-a.time).map(x=>x.row).join('')}</details>`:'');
  const next=Math.min(...times.filter(time=>time>now));
  if(Number.isFinite(next))promotionListTimer=setTimeout(()=>renderPromotionLists(view),Math.min(next-now+50,2147483647));
}

function savePromotion(event,form){
  event.preventDefault();
  const product=prod(form.dataset.product);
  if(!product)return;
  const price=form.elements.price.valueAsNumber,mode=form.elements.mode.value,now=Date.now();
  const start=mode==='original'?Date.parse(product.promotion?.start):mode==='now'?now:Date.parse(form.elements.start.value+'-05:00');
  const end=Date.parse(form.elements.end.value+'-05:00');
  if(!(price>0&&price<product.p))return toast('El descuento debe ser menor al precio habitual.');
  if(mode==='scheduled'&&start<=now)return toast('Elige un inicio futuro o selecciona Ahora.');
  if(!(end>start&&end>now))return toast('El fin debe ser posterior al inicio y a la hora actual.');
  changePromotion(product.id,{price,start:new Date(start).toISOString(),end:new Date(end).toISOString()});
}

      </form>`;
    }).join('')}</div>
    <p class="order-empty" id="order-empty" hidden></p>
  </section>`);
  admFilterOrders();
}
function admFilterOrders(){
  const section=$('#adm-orders');
  const normalize=text=>text.toLocaleLowerCase('es').normalize('NFD').replace(/\p{Diacritic}/gu,'');
  ADM.orderQuery=$('#order-search').value;
  const words=normalize(ADM.orderQuery.trim()).split(/\s+/).filter(Boolean);
  const filter=ADM.orderFilter||'';
  const rows=section.querySelectorAll('[data-order]');
  let shown=0;
  for(const row of rows){
    const haystack=normalize(row.dataset.orderSearch);
    row.hidden=Boolean(filter&&row.dataset.savedState!==filter)||!words.every(word=>haystack.includes(word));
    if(!row.hidden)shown++;
  }
  for(const button of section.querySelectorAll('[data-order-filter]')){
    button.setAttribute('aria-pressed',String(button.dataset.orderFilter===filter));
  }
  $('#order-count').textContent=`${shown} de ${rows.length} pedidos`;
  const empty=$('#order-empty');
  empty.hidden=shown>0;
  empty.textContent=rows.length?'No hay pedidos que coincidan con la búsqueda o el estado.':'Todavía no hay pedidos registrados.';
}
async function admOrderSave(event,form){
  event.preventDefault();
  if(!ADM.ok||form.getAttribute('aria-busy'))return;
  const status=event.submitter?.value==='accept'?'aceptado':event.submitter?.value==='deliver'?'entregado':form.elements.status.value;
  if(!Object.hasOwn(orderStates,status))return;
  const reason=status==='rechazado'?form.elements.reason.value.trim():'';
  form.setAttribute('aria-busy','true');
  form.querySelectorAll('button').forEach(button=>button.disabled=true);
  try{
    const {session}=await kenResult(adminClient.auth.getSession());
    if(!session)throw new Error('Sesión vencida.');
    const response=await fetch('/api/update-order',{
      method:'POST',
      headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},
      body:JSON.stringify({id:form.dataset.order,status,reason})
    });
    if(response.status===409){
      const {code}=await response.json().catch(()=>({}));
      return toast(code==='PRODUCT_REMOVED'?'El producto fue retirado. Revisa el comprobante y coordina la solución con el cliente.':'No hay unidades disponibles para aceptar este pedido.');
    }
    if(!response.ok)throw new Error('La API rechazó el cambio.');
    toast('Estado actualizado');
    if(form.isConnected&&!publishing){
      const version=catalogVersion;
      const fresh=await kenReadCatalog(adminClient).catch(()=>null);
      if(fresh&&form.isConnected&&!publishing&&catalogVersion===version){
        admApply(fresh.products,fresh.categories,fresh.subcategories);
        SITE=fresh.site;publishedSite=structuredClone(SITE);catalogVersion=fresh.updated_at;
      }
    }
    if(form.isConnected){
      const scroll=window.scrollY;
      if(ADM.tab==='delivery')await admDelivery();
      else await admOrders(ADM.orderFilter,ADM.orderScope);
      if(ADM.tab==='orders')window.scrollTo(0,scroll);
    }
  }catch(e){toast('No se pudo actualizar el estado. Intenta de nuevo.')}
  finally{
    form.removeAttribute('aria-busy');
    form.querySelectorAll('button').forEach(button=>button.disabled=false);
  }
}
async function admPublishFirst(){
  if(catalogVersion||publishing)return;
  if(await admSave()){admRes();toast('Catálogo publicado')}
}
async function loadSalesSummary(view){
  try{
    const orders=await loadAdminOrders();
    if(!view.isConnected)return;
    const sum=scope=>orders.filter(o=>orderInScope(o,scope)).reduce((total,o)=>total+Number(o.price||0),0);
    const salesMoney=new Intl.NumberFormat('es-PE',{style:'currency',currency:'PEN'});
    const cards=[
      ['Cobrado hoy',salesMoney.format(sum('today')),"openOrderTask('today')"],
      ['Cobrado este mes',salesMoney.format(sum('month')),"openOrderTask('month')"],
      ['Por verificar',orders.filter(o=>o.status==='pendiente').length,"openOrderTask('pending')"],
      ['Por entregar',orders.filter(o=>orderInScope(o,'delivery')).length,"admDelivery()"],
      ['Stock bajo',P.filter(isLowStock).length,"ADM.productFilters={stock:'low'};admList()"]
    ];
    const render=items=>items.map(([label,value,action])=>`<button type="button" onclick="${action}"><strong>${value}</strong><span class="summary-card-label">${label}</span></button>`).join('');
    view.innerHTML=`<div class="adm-summary-groups">
      <section><h3>Cobros</h3><div class="workflow-summary adm-summary-metrics adm-summary-sales">${render(cards.slice(0,2))}</div></section>
      <section><h3>Tareas</h3><div class="workflow-summary adm-summary-metrics adm-summary-tasks">${render(cards.slice(2))}</div></section>
    </div>`;
  }catch{if(view.isConnected)view.textContent='No se pudo cargar el resumen de ventas.'}
}
function admRes(){ADM.tab='res';const ag=P.filter(p=>p.st===0).length,hid=(SITE.hide||[]).length;
  modal(`<div class="adm-summary"><h2>Resumen</h2><div id="sales-summary">Cargando ventas…</div>
  ${catalogVersion?'':'<p class="mu">Publica el catálogo para que los clientes puedan registrar pedidos.</p><button class="pri" onclick="admPublishFirst()">Publicar catálogo</button>'}
  <h3>Catálogo</h3><div class="stat adm-summary-catalog"><div><b>${P.length}</b><span>Productos</span></div><div><b>${ag}</b><span>Agotados</span></div><div><b>${CATS.length-1}</b><span>Categorías</span></div><div><b>${Object.keys(SITE.t).length}</b><span>Textos editados</span></div><div><b>${hid}</b><span>Secciones ocultas</span></div></div>
  <div class="bar2 adm-summary-actions"><button class="pri" onclick="admForm()">Nuevo producto</button><button onclick="admOrders('pendiente')">Pedidos pendientes</button><button onclick="admCats()">Editar categorías</button><a class="btn" href="${esc(CFG.CATALOGO)}">Ver tienda</a></div></div>`);loadSalesSummary($('#sales-summary'))}
function admSec(){const h=SITE.hide||[],a=SITE.ann||{};
  modal(`<h2>🧩 Secciones y avisos</h2><label>Secciones visibles</label>${SEC.map(([k,l])=>`<label style="font-weight:400"><input type="checkbox" id="h_${k}"${h.includes(k)?'':' checked'}>${l}</label>`).join('')}
  <label for="a_t">Barra de anuncio superior (vacío = sin barra)</label><input id="a_t" value="${esc(a.t||'')}" placeholder="🔥 Promo de la semana…"><label for="a_c">Color de la barra</label><input id="a_c" type="color" value="${a.c||'#1c1c1c'}">
  <label for="m_t">Mensaje de mantenimiento</label><textarea id="m_t" rows="2" placeholder="Volvemos pronto.">${esc(SITE.maint||SITE.maintMessage||'')}</textarea>
  <div class="bar2"><button class="ok" style="flex:1" onclick="admSecSave()">Guardar</button></div>`)}
function admSecSave(){if(publishing)return;SITE.hide=SEC.map(s=>s[0]).filter(k=>!$('#h_'+k).checked);SITE.ann={t:v('a_t').trim(),c:v('a_c')};SITE.maintMessage=v('m_t').trim()||'Volvemos pronto.';if(SITE.maint)SITE.maint=SITE.maintMessage;siteSave()}
const CF={pay:['💳 Pagos y contacto',[['WA','WhatsApp de pedidos (con código de país, sin +)'],['GROUP','Enlace del grupo de WhatsApp'],['TITULAR','Titular de la cuenta de pago'],['YAPE','Yape / Plin']],'QR','QR de pago',0],
  look:['🎨 Apariencia',[['@title','Título de la pestaña del navegador']],'LOGO','Logo',1],emp:['🏢 Empresa',[['RAZON','Razón social'],['RUC','RUC']],0,0,0]};
function admUp(n,el){prepareStoreImage(el,$('#pv_'+n),'contain',n)}
function admCfg(g){const [t,fl,up,ul,col]=CF[g],c=SITE.cfg,k=SITE.col;ADM.up={};
  modal(`<h2>${t}</h2><p class="mu" style="font-size:.78rem">Vacío = usa el valor original del catálogo.</p>${fl.map(([x,l])=>`<label for="c_${x}">${l}</label><input id="c_${x}" value="${esc(x=='@title'?SITE.title:c[x])||''}">`).join('')}
  ${up?`<label for="site-image"> ${ul}</label><input id="site-image" type="file" accept="image/*" onchange="admUp('${up}',this)"><img id="pv_${up}" class="pv" alt="Vista previa de ${esc(ul)}" style="max-width:110px"${c[up]?` src="${esc(c[up])}"`:''}>`:''}
  ${col?`<div class="g2"><div><label for="k_ac">Color principal</label><input id="k_ac" type="color" value="${k.ac||'#b3261e'}"></div><div><label for="k_ac2">Color secundario (hover)</label><input id="k_ac2" type="color" value="${k.ac2||'#8f1e18'}"></div></div>`:''}
  <div class="bar2"><button class="ok" style="flex:1" onclick="admCfgSave('${g}')">Guardar</button><button style="flex:1" onclick="admCfgReset('${g}')">Restablecer</button></div>`)}
async function admCfgSave(g){
  if(publishing)return;
  const [t,fl,up,ul,col]=CF[g],input=$('#site-image');
  if(input?.hasAttribute('aria-busy'))return toast('Espera a que termine el procesamiento de la imagen.');
  if(input){
    try{
      const url=await uploadStoreImage(input,up==='QR'?'qr':'logo');
      if(!input.isConnected)return;
      if(url){ADM.up[up]=url;clearImagePreview();$('#pv_'+up).src=url}
    }catch(error){return toast('No se pudo subir la imagen. Intenta guardar otra vez.')}
  }
  if(publishing)return;
  fl.forEach(([x])=>{const s=v('c_'+x).trim();if(x=='@title')SITE.title=s;else if(s)SITE.cfg[x]=s;else delete SITE.cfg[x]});
  if(up&&ADM.up[up])SITE.cfg[up]=ADM.up[up];if(col)[['ac','#b3261e'],['ac2','#8f1e18']].forEach(([x,d])=>{const s=v('k_'+x);if(s&&s!=d)SITE.col[x]=s;else delete SITE.col[x]});siteSave()}
async function admCfgReset(g){if(publishing||$('#site-image')?.hasAttribute('aria-busy'))return;const [t,fl,up,ul,col]=CF[g];fl.forEach(([x])=>{if(x=='@title')SITE.title='';else delete SITE.cfg[x]});if(up)delete SITE.cfg[up];if(col)SITE.col={};if(await siteSave())admCfg(g)}

let adminInstallPrompt;
const adminInstallButton=$('#admin-install');
adminInstallButton.hidden=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
window.addEventListener('beforeinstallprompt',event=>{
